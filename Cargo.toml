[package]
name = "loggle"
version = "0.1.0"
edition = "2024"
description = "A terminal log viewer for local, newline-delimited logs."
license = "MIT"
repository = "https://github.com/maximilianpw/loggle"
homepage = "https://github.com/maximilianpw/loggle"
readme = "README.md"
keywords = ["logs", "tui", "docker", "compose"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/.github", "/dist-workspace.toml", "/dist.toml", "/public"]

[features]
perf-harness = []

[[bin]]
name = "loggle-bench"
path = "src/bin/loggle-bench.rs"
required-features = ["perf-harness"]

[dependencies]
clap = { version = "4.5.38", features = ["derive"] }
crossterm = { version = "0.28.1", features = ["use-dev-tty"] }
libc = "0.2.172"
ratatui = "0.29.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.45.0", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync"] }
toml = "0.8"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
