name: Publish Crates

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: true

jobs:
  publish-crate:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish crate
        shell: bash
        run: |
          set -euo pipefail

          package=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0]')
          name=$(jq -r '.name' <<<"$package")
          version=$(jq -r '.version' <<<"$package")

          if cargo info "${name}@${version}" --registry crates-io >/dev/null 2>&1; then
            echo "${name} ${version} is already published on crates.io; skipping."
            exit 0
          fi

          cargo publish --locked --package "$name"
