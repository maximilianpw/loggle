name: Elixir milestone
on:
  push:
    branches: [main, elixir-rewrite]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '25.3'
          elixir-version: '1.14.5'
      - run: mix deps.get --check-locked
      - run: mix format --check-formatted
      - run: mix test --warnings-as-errors
      - run: MIX_ENV=prod mix release --overwrite
      - run: python3 test/pty_test.py _build/prod/rel/loggle/bin/loggle
      # Deliberately no tags, uploads, credentials, or publishing jobs.
